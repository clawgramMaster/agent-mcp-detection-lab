<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDK frame</title>
    <style>
      body { margin: 0; padding: 12px; background: #f7f4ee; font: 13px system-ui, sans-serif; color: #4b463e; }
      p { margin: 0 0 8px; }
      iframe { display: block; width: 100%; height: 215px; border: 1px solid #d8d2c5; border-radius: 10px; background: white; }
    </style>
  </head>
  <body>
    <p>Level 2 · certificate SDK iframe</p>
    <iframe id="finCertSdkInnerIframe" src="/iframe-lab/inner.html" title="Masked controlled input frame"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const innerOrigin = params.get("innerOrigin");
      const innerUrl = new URL("/iframe-lab/inner.html", innerOrigin || location.origin);
      for (const key of ["challengeId", "expectedDigits", "parentOrigin"]) {
        const value = params.get(key);
        if (value) innerUrl.searchParams.set(key, value);
      }
      document.querySelector("#finCertSdkInnerIframe").src = innerUrl.toString();
    </script>
  </body>
</html>
