<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow DOM hover challenge</title>
    <style>
      body { margin: 0; padding: 18px; background: #faf8f4; color: #1b1915; font: 13px system-ui, sans-serif; }
      p { margin: 0 0 14px; color: #6f695f; }
    </style>
  </head>
  <body>
    <p>Iframe interaction surface · menu rendered in a closed Shadow DOM</p>
    <div id="shadowHost"></div>
    <script>
      const OPTIONS = ["Card", "Bank transfer", "Kakao Pay"];
      const params = new URLSearchParams(location.search);
      const challengeId = params.get("challengeId") || "";
      const requestedOption = params.get("expectedOption") || "";
      const expectedOption = OPTIONS.includes(requestedOption) ? requestedOption : OPTIONS[0];
      const configuredParentOrigin = (() => {
        try {
          const url = new URL(params.get("parentOrigin"));
          return url.protocol === "http:" || url.protocol === "https:" ? url.origin : "";
        } catch {
          return "";
        }
      })();
      const referrerOrigin = (() => {
        try {
          return document.referrer ? new URL(document.referrer).origin : "";
        } catch {
          return "";
        }
      })();
      const parentOrigin =
        configuredParentOrigin && (!referrerOrigin || configuredParentOrigin === referrerOrigin)
          ? configuredParentOrigin
          : "";

      const root = document.querySelector("#shadowHost").attachShadow({ mode: "closed" });
      root.innerHTML = `
        <style>
          .wrap { position: relative; display: inline-block; min-width: 210px; padding-bottom: 125px; }
          .trigger { width: 210px; padding: 11px 14px; border: 1px solid #d8d2c5; border-radius: 8px; background: white; color: #1b1915; font: 600 14px system-ui, sans-serif; text-align: left; cursor: default; }
          .trigger:focus-visible { outline: 2px solid #3f7d54; outline-offset: 2px; }
          .menu { display: none; position: absolute; top: 46px; left: 0; box-sizing: border-box; width: 210px; padding: 6px; border: 1px solid #d8d2c5; border-radius: 8px; background: white; box-shadow: 0 8px 20px rgba(27, 25, 21, .16); }
          .open .menu { display: block; }
          .item { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; color: #1b1915; font: 13px system-ui, sans-serif; text-align: left; cursor: pointer; }
          .item:hover, .item:focus-visible { background: #e8efe6; outline: none; }
        </style>
        <div class="wrap">
          <button class="trigger" type="button">Payment method ▾</button>
          <div class="menu" role="menu"></div>
        </div>
      `;
      const wrap = root.querySelector(".wrap");
      const trigger = root.querySelector(".trigger");
      const menu = root.querySelector(".menu");
      let closeTimer = 0;

      const report = (event, selectedOption = "") => {
        if (!challengeId || !parentOrigin) return;
        window.parent.postMessage(
          {
            source: "hover-shadow-lab",
            challengeId,
            event: event.type === "mouseenter" ? "open" : "select",
            selectedOption,
            isTrusted: event.isTrusted,
            timestamp: performance.now(),
          },
          parentOrigin,
        );
      };
      const close = () => wrap.classList.remove("open");
      const scheduleClose = () => {
        window.clearTimeout(closeTimer);
        closeTimer = window.setTimeout(close, 180);
      };

      trigger.addEventListener("mouseenter", (event) => {
        window.clearTimeout(closeTimer);
        wrap.classList.add("open");
        report(event);
      });
      wrap.addEventListener("mouseenter", () => window.clearTimeout(closeTimer));
      wrap.addEventListener("mouseleave", scheduleClose);
      trigger.addEventListener("click", (event) => event.preventDefault());

      for (const option of OPTIONS) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "item";
        item.role = "menuitem";
        item.textContent = option;
        item.addEventListener("click", (event) => {
          report(event, option);
          close();
          if (option === expectedOption) {
            trigger.textContent = `${option} selected`;
            trigger.disabled = true;
          }
        });
        menu.append(item);
      }
    </script>
  </body>
</html>
