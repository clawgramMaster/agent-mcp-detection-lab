<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controlled input frame</title>
    <style>
      body { margin: 0; padding: 18px; font: 13px system-ui, sans-serif; color: #1b1915; background: #faf8f4; }
      label { display: block; color: #6f695f; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
      input { box-sizing: border-box; width: 100%; margin-top: 7px; padding: 12px 14px; border: 1px solid #d8d2c5; border-radius: 9px; font: 17px ui-monospace, monospace; }
      input:focus { outline: 2px solid #3f7d54; border-color: transparent; }
      button { margin-top: 10px; padding: 8px 12px; border: 1px solid #d8d2c5; border-radius: 999px; background: white; cursor: pointer; }
      .status { margin-top: 12px; padding: 9px 11px; border-radius: 8px; background: #efece4; color: #6f695f; }
      .complete { background: #e8efe6; color: #2f6742; }
    </style>
  </head>
  <body>
    <label for="phone">Mobile number</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="010-1234-5678" />
    <button id="blurCheck" type="button">Blur and verify state</button>
    <div id="status" class="status">Controlled state: empty</div>
    <script>
      const phone = document.querySelector("#phone");
      const status = document.querySelector("#status");
      const params = new URLSearchParams(location.search);
      const challengeId = params.get("challengeId") || "";
      const requestedDigits = params.get("expectedDigits") || "";
      const expectedDigits = /^010\d{8}$/.test(requestedDigits) ? requestedDigits : "01012345678";
      const parentOrigin = (() => {
        try {
          return new URL(params.get("parentOrigin")).origin;
        } catch {
          return location.origin;
        }
      })();
      let controlledValue = "";

      const mask = (value) => {
        const digits = value.replace(/\D/g, "").slice(0, 11);
        if (digits.length <= 3) return digits;
        if (digits.length <= 7) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
        return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
      };

      const render = () => {
        phone.value = controlledValue;
        const complete = controlledValue.replace(/\D/g, "") === expectedDigits;
        status.className = `status${complete ? " complete" : ""}`;
        status.textContent = complete ? `Controlled state retained: ${controlledValue}` : `Controlled state: ${controlledValue || "empty"}`;
        return complete;
      };

      const report = (event, accepted = false) => {
        const observedDomValue = phone.value;
        const complete = render();
        window.top.postMessage(
          {
            source: "iframe-input-lab",
            challengeId,
            event: event.type,
            key: event.key || "",
            inputType: event.inputType || "",
            isTrusted: event.isTrusted,
            domValue: observedDomValue,
            controlledValue,
            accepted,
            complete,
            timestamp: performance.now(),
          },
          parentOrigin,
        );
      };

      for (const type of ["focus", "keydown", "beforeinput", "keyup", "change", "blur"]) {
        phone.addEventListener(type, (event) => report(event));
      }

      phone.addEventListener("input", (event) => {
        const accepted = event.isTrusted;
        if (accepted) controlledValue = mask(phone.value);
        report(event, accepted);
      });

      document.querySelector("#blurCheck").addEventListener("click", (event) => {
        phone.blur();
        report(event);
      });

      render();
    </script>
  </body>
</html>
